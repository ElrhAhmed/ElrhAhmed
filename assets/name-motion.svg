  <style>
    :root {
      --ink: #f4f7fb;
      --soft: #93a4b8;
      --faint: #34455a;
      --amber: #f59e0b;
      --blue: #58a6ff;
    }
    .ink-start { stop-color: var(--ink); }
    .ink-mid { stop-color: var(--ink); }
    .ink-end { stop-color: var(--ink); }
    .ink-shimmer { stop-color: var(--blue); }
    .name-base { animation: name-breathe 5.4s ease-in-out infinite; }
    .spark { animation: travel 5.8s 1.7s ease-in-out infinite; }
    .orbit-a {
      transform-origin: 62px 85px;
      animation: orbit 18s linear infinite;
    }
    .orbit-b {
      transform-origin: 838px 88px;
      animation: orbit-reverse 22s linear infinite;
    }
    @keyframes travel {
      0% { transform: translateX(0); opacity: 0; }
      12% { opacity: 1; }
      78% { opacity: 1; }
      100% { transform: translateX(580px); opacity: 0; }
    }
    @keyframes name-breathe {
      0%, 100% { opacity: .82; }
      50% { opacity: 1; }
    }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes orbit-reverse { to { transform: rotate(-360deg); } }

    @media (prefers-color-scheme: light) {
      :root {
        --ink: #111827;
        --soft: #526175;
        --faint: #cbd5e1;
        --amber: #c86f00;
        --blue: #1769aa;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .ink-shimmer { stop-color: var(--ink); }
      .name-base { opacity: 1; animation: none; }
      .spark { display: none; }
      .orbit-a, .orbit-b { animation: none; }
    }
  </style>

  <g fill="none" stroke="var(--faint)" stroke-width="1">
    <g class="orbit-a">
      <circle cx="62" cy="85" r="31" stroke-dasharray="2 9"/>
      <circle cx="62" cy="54" r="2.5" fill="var(--amber)" stroke="none"/>
    </g>
    <path d="M18 85h26M80 85h28" stroke-dasharray="1 7"/>
    <g class="orbit-b">
      <circle cx="838" cy="88" r="27" stroke-dasharray="1 8"/>
      <circle cx="838" cy="115" r="2.5" fill="var(--blue)" stroke="none"/>
    </g>
    <path d="M792 88h19M865 88h17" stroke-dasharray="1 7"/>
  </g>

  <g class="name-base" transform="translate(18 40)" fill="url(#name-ink)">
    <use class="letter l1" href="#glyph-a" x="0" y="75.85"/>
    <use class="letter l2" href="#glyph-h" x="60" y="75.85"/>
    <use class="letter l3" href="#glyph-m" x="128" y="75.85"/>
