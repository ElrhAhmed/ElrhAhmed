<svg xmlns="http://www.w3.org/2000/svg" width="900" height="205" viewBox="0 0 900 205" role="img" aria-labelledby="title desc">
  <title id="title">Ahmed El Rhorba</title>
  <desc id="desc">Ahmed El Rhorba in animated abstract lettering, followed by Cloud Security, DevSecOps and Security Engineering.</desc>

