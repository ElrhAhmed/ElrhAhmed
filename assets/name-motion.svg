    <use class="letter l8" href="#glyph-r" x="484" y="75.85"/>
    <use class="letter l9" href="#glyph-h" x="546" y="75.85"/>
    <use class="letter l10" href="#glyph-o" x="614" y="75.85"/>
    <use class="letter l11" href="#glyph-r" x="684" y="75.85"/>
    <use class="letter l12" href="#glyph-b" x="746" y="75.85"/>
    <use class="letter l13" href="#glyph-a" x="805" y="75.85"/>
  </g>

  <path class="thread" d="M160 145H740" fill="none" stroke="url(#thread-ink)" stroke-width="1.5"/>
  <circle class="spark" cx="160" cy="145" r="3.5" fill="var(--amber)" filter="url(#spark-glow)"/>

  <g class="role">
    <text x="450" y="179" text-anchor="middle" fill="var(--soft)" font-family="'Red Hat Display','Segoe UI',sans-serif" font-size="13" font-weight="600" letter-spacing="3">CLOUD SECURITY · DEVSECOPS · SECURITY ENGINEERING</text>
    <circle cx="126" cy="175" r="2" fill="var(--amber)"/>
    <circle cx="774" cy="175" r="2" fill="var(--blue)"/>
  </g>
</svg>
