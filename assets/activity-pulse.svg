<svg xmlns="http://www.w3.org/2000/svg" width="900" height="132" viewBox="0 0 900 132" role="img" aria-labelledby="title desc">
  <title id="title">ElrhAhmed public GitHub activity pulse</title>
  <desc id="desc">A subtle animated line representing public contribution activity over the last twelve weeks.</desc>
  <style>
    :root { --ink:#dce7f4; --muted:#71839a; --line:#2b3d52; --amber:#f59e0b; --blue:#58a6ff; }
    .label { font:600 10px "Red Hat Display","Segoe UI",sans-serif; letter-spacing:2px; fill:var(--muted); }
    .pulse { fill:none; stroke:url(#pulse-ink); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1600; animation:draw 2s ease-out both; }
    .day { fill:var(--ink); animation:breathe 4.8s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    .runner { animation:travel 7s 1.4s ease-in-out infinite; }
    @keyframes draw { from { stroke-dashoffset:1600; } to { stroke-dashoffset:0; } }
    @keyframes breathe { 0%,100% { transform:scale(.82); } 50% { transform:scale(1.12); } }
    @keyframes travel { 0% { transform:translateX(0); opacity:0; } 10% { opacity:1; } 85% { opacity:1; } 100% { transform:translateX(832px); opacity:0; } }
    @media (prefers-color-scheme:light) {
      :root { --ink:#27364a; --muted:#65758a; --line:#d7e0ea; --amber:#c86f00; --blue:#1769aa; }
    }
    @media (prefers-reduced-motion:reduce) {
      .pulse { stroke-dashoffset:0; animation:none; }
      .day { animation:none; }
      .runner { display:none; }
    }
  </style>
  <defs>
    <linearGradient id="pulse-ink" x1="34" y1="0" x2="866" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--amber)" stop-opacity=".28"/>
      <stop offset=".48" stop-color="var(--blue)"/>
      <stop offset="1" stop-color="var(--amber)" stop-opacity=".28"/>
    </linearGradient>
    <filter id="runner-glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text class="label" x="34" y="17">PUBLIC ACTIVITY · 12 WEEKS</text>
  <text class="label" x="866" y="17" text-anchor="end">SYNCING ON FIRST RUN</text>
  <path d="M34 82H866" stroke="var(--line)" stroke-width="1"/>
  <polyline class="pulse" points="34.0,82.0 44.0,82.0 54.0,82.0 64.1,82.0 74.1,82.0 84.1,82.0 94.1,82.0 104.2,82.0 114.2,82.0 124.2,82.0 134.2,82.0 144.3,82.0 154.3,82.0 164.3,82.0 174.3,82.0 184.4,82.0 194.4,82.0 204.4,82.0 214.4,82.0 224.5,82.0 234.5,82.0 244.5,82.0 254.5,82.0 264.6,82.0 274.6,82.0 284.6,82.0 294.6,82.0 304.7,82.0 314.7,82.0 324.7,82.0 334.7,82.0 344.7,82.0 354.8,82.0 364.8,82.0 374.8,82.0 384.8,82.0 394.9,82.0 404.9,82.0 414.9,82.0 424.9,82.0 435.0,82.0 445.0,82.0 455.0,82.0 465.0,82.0 475.1,82.0 485.1,82.0 495.1,82.0 505.1,82.0 515.2,82.0 525.2,82.0 535.2,82.0 545.2,82.0 555.3,82.0 565.3,82.0 575.3,82.0 585.3,82.0 595.3,82.0 605.4,82.0 615.4,82.0 625.4,82.0 635.4,82.0 645.5,82.0 655.5,82.0 665.5,82.0 675.5,82.0 685.6,82.0 695.6,82.0 705.6,82.0 715.6,82.0 725.7,82.0 735.7,82.0 745.7,82.0 755.7,82.0 765.8,82.0 775.8,82.0 785.8,82.0 795.8,82.0 805.9,82.0 815.9,82.0 825.9,82.0 835.9,82.0 846.0,82.0 856.0,82.0 866.0,82.0"/>

  <circle class="runner" cx="34" cy="82" r="3.2" fill="var(--amber)" filter="url(#runner-glow)"/>
  <text class="label" x="34" y="120">2026-06-29</text>
  <text class="label" x="866" y="120" text-anchor="end">2026-09-20</text>
</svg>
