<svg xmlns="http://www.w3.org/2000/svg" width="900" height="132" viewBox="0 0 900 132" role="img" aria-labelledby="title desc">
  <title id="title">ElrhAhmed public GitHub activity pulse</title>
  <desc id="desc">A subtle animated line representing public contribution activity over the last twelve weeks.</desc>
  <style>
    :root { --ink:#dce7f4; --muted:#71839a; --line:#2b3d52; --amber:#f59e0b; --blue:#58a6ff; }
    .label { font:600 10px "Red Hat Display","Segoe UI",sans-serif; letter-spacing:2px; fill:var(--muted); }
    .amber-stop { stop-color:var(--amber); }
    .blue-stop { stop-color:var(--blue); }
    .pulse { fill:none; stroke:url(#pulse-ink); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
    .day { fill:var(--ink); }
    .runner { fill:var(--amber); }
    @media (prefers-color-scheme:light) {
      :root { --ink:#27364a; --muted:#65758a; --line:#d7e0ea; --amber:#c86f00; --blue:#1769aa; }
    }
    @media (prefers-reduced-motion:reduce) {
      .runner { display:none; }
    }
  </style>
  <defs>
    <linearGradient id="pulse-ink" x1="34" y1="0" x2="866" y2="0" gradientUnits="userSpaceOnUse">
      <stop class="amber-stop" offset="0" stop-opacity=".28"/>
      <stop class="blue-stop" offset=".48"/>
      <stop class="amber-stop" offset="1" stop-opacity=".28"/>
    </linearGradient>
    <filter id="runner-glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text class="label" x="34" y="17">PUBLIC ACTIVITY · 12 WEEKS</text>
  <text class="label" x="866" y="17" text-anchor="end">201 CONTRIBUTIONS</text>
  <path d="M34 82H866" stroke="var(--line)" stroke-width="1"/>
  <path class="pulse" d="M 34.0,72.4 L 109.6,69.7 L 185.3,66.4 L 260.9,63.7 L 336.5,62.1 L 412.2,65.5 L 487.8,72.4 L 563.5,61.4 L 639.1,64.6 L 714.7,53.3 L 790.4,40.0 L 866.0,47.1"/>
    <circle class="day" cx="34.0" cy="72.4" r="2.0" opacity="0.34"/>
    <circle class="day" cx="109.6" cy="69.7" r="2.2" opacity="0.39"/>
    <circle class="day" cx="185.3" cy="66.4" r="2.4" opacity="0.45"/>
    <circle class="day" cx="260.9" cy="63.7" r="2.5" opacity="0.50"/>
    <circle class="day" cx="336.5" cy="62.1" r="2.6" opacity="0.53"/>
    <circle class="day" cx="412.2" cy="65.5" r="2.4" opacity="0.47"/>
    <circle class="day" cx="487.8" cy="72.4" r="2.0" opacity="0.34"/>
    <circle class="day" cx="563.5" cy="61.4" r="2.7" opacity="0.54"/>
    <circle class="day" cx="639.1" cy="64.6" r="2.5" opacity="0.48"/>
    <circle class="day" cx="714.7" cy="53.3" r="3.2" opacity="0.69"/>
    <circle class="day" cx="790.4" cy="40.0" r="4.0" opacity="0.94"/>
    <circle class="day" cx="866.0" cy="47.1" r="3.6" opacity="0.81"/>
  <circle class="runner" r="3.2">
    <animateMotion path="M 34.0,72.4 L 109.6,69.7 L 185.3,66.4 L 260.9,63.7 L 336.5,62.1 L 412.2,65.5 L 487.8,72.4 L 563.5,61.4 L 639.1,64.6 L 714.7,53.3 L 790.4,40.0 L 866.0,47.1" dur="7s" begin="1.4s" repeatCount="indefinite"/>
  </circle>
  <text class="label" x="34" y="120">2026-06-29</text>
  <text class="label" x="866" y="120" text-anchor="end">2026-09-20</text>
</svg>
