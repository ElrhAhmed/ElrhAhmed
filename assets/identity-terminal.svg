  <style>
    .ui { font-family: "Red Hat Display", "Segoe UI", sans-serif; }
    .mono { font-family: "Adwaita Mono", "Cascadia Code", monospace; }
    .boot { opacity: 0; animation: rise .7s ease-out forwards; }
    .boot-1 { animation-delay: .2s; }
    .boot-2 { animation-delay: .85s; }
    .boot-3 { animation-delay: 3.15s; }
    .name-reveal { animation: reveal 2.35s .85s cubic-bezier(.65,0,.35,1) forwards; }
    .cursor { animation: cursor-travel 2.35s .85s cubic-bezier(.65,0,.35,1) forwards, blink 1s 3.3s step-end infinite; }
    .signal { animation: signal-run 5.5s 3.6s ease-in-out infinite; }
    .node { fill: #17263a; stroke: #41536b; animation: node-pulse 5.5s ease-in-out infinite; }
    .node-2 { animation-delay: .9s; }
    .node-3 { animation-delay: 1.8s; }
    .node-4 { animation-delay: 2.7s; }
    .scan { animation: scan 7s ease-in-out infinite; }

    @keyframes rise {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes reveal {
      0% { width: 0; }
      100% { width: 582px; }
    }
    @keyframes cursor-travel {
      0% { transform: translateX(0); }
      100% { transform: translateX(670px); }
    }
    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }
    @keyframes signal-run {
      0% { transform: translateX(0); opacity: 0; }
      8% { opacity: 1; }
      82% { opacity: 1; }
      100% { transform: translateX(600px); opacity: 0; }
    }
    @keyframes node-pulse {
      0%, 70%, 100% { fill: #17263a; stroke: #41536b; }
      8%, 18% { fill: #f59e0b; stroke: #ffd27a; }
    }
    @keyframes scan {
      0%, 100% { transform: translateX(-180px); opacity: 0; }
      15%, 75% { opacity: .28; }
      90% { transform: translateX(900px); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot { opacity: 1; animation: none; }
      .name-reveal { width: 582px; animation: none; }
      .cursor { transform: translateX(670px); animation: none; }
      .signal, .scan { display: none; }
      .node { animation: none; }
    }
  </style>

