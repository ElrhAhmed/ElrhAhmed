name: Refresh activity pulse

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/render_activity.py"
      - ".github/workflows/activity-pulse.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity-pulse
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render public activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 .github/scripts/render_activity.py

      - name: Publish changed pulse
        run: |
          if git diff --quiet -- assets/activity-pulse.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-pulse.svg
          git commit -m "chore: refresh activity pulse"
          git push
